# Drop-in for infinite.service, installed as /etc/systemd/system/infinite.service.d/egress-firewall.conf when
# enforce mode is turned on (see deploy/ubuntu/egress.md, step 5).
#
# The API, which launches every agent session, starts only after the egress firewall rule has loaded, and does not
# start if loading it failed. Stopping or restarting the firewall unit also stops or restarts the API. Workers
# outlive the API (KillMode=process), so neither stops agents that are already running, and nothing here protects
# those agents while the table is gone: stop agent work before any step that removes it (see the runbook).
[Unit]
Requires=infinite-egress-firewall.service
After=infinite-egress-firewall.service

[Service]
# The firewall unit stays active after its command has exited, so Requires= cannot see a table that was removed
# later: a reload of nftables.service flushes it, and the reload that follows on the firewall unit can fail. Each
# API start therefore loads the rule again, as root ("+"), and the API does not start when that load fails.
ExecStartPre=+/usr/sbin/nft -f /etc/infinite-egress/firewall.nft
