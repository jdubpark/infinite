# Drop-in for infinite.service, installed as /etc/systemd/system/infinite.service.d/egress-firewall.conf when
# enforce mode is turned on (see deploy/ubuntu/egress.md, step 5).
#
# The API, which launches every agent session, starts only after the egress firewall rule has loaded, and does not
# start if loading it failed. Stopping or restarting the firewall unit also stops or restarts the API. Workers
# outlive the API (KillMode=process), so neither stops agents that are already running.
[Unit]
Requires=infinite-egress-firewall.service
After=infinite-egress-firewall.service
