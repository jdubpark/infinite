# Drop-in for nftables.service, installed as /etc/systemd/system/nftables.service.d/infinite-egress.conf together
# with the egress firewall unit (see deploy/ubuntu/egress.md, step 4).
#
# nftables.service runs /etc/nftables.conf, whose "flush ruleset" removes every table, the egress table included, on
# start, restart, and reload. The firewall unit follows a restart (PartOf=) and a reload (ReloadPropagatedFrom=), but
# systemd propagates no start: Ubuntu 24.04 ships nftables.service disabled, and starting it then left agents without
# a rule while the firewall unit still reported active (found in the INF-257 rehearsal). These lines load the egress
# rule again as part of the same job, so the job fails, visibly, when the rule does not load.
[Service]
ExecStartPost=/usr/sbin/nft -f /etc/infinite-egress/firewall.nft
ExecReload=/usr/sbin/nft -f /etc/infinite-egress/firewall.nft
