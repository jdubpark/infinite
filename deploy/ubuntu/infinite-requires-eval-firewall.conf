# Drop-in for infinite.service, installed as /etc/systemd/system/infinite.service.d/eval-firewall.conf only where
# the eval network rule is installed (see deploy/ubuntu/eval.md, step 5).
#
# The API, which starts every trial, starts only after the eval firewall rule has loaded, and does not start if
# loading it failed. Without this, a failed firewall unit at boot would leave trials on a direct route, labelled
# `none`. Stopping or restarting the firewall unit also stops or restarts the API. Workers outlive the API
# (KillMode=process), so neither stops trials that are already running, and nothing here protects those trials
# while the table is gone: stop trials before any step that removes it (eval.md, step 5).
[Unit]
Requires=infinite-eval-firewall.service
After=infinite-eval-firewall.service

[Service]
# The firewall unit stays active after its command has exited, so Requires= cannot see a table that was removed
# later: a reload of nftables.service flushes it, and the reload that follows on the firewall unit can fail. Each
# API start therefore loads the rule again, as root ("+"), and the API does not start when that load fails.
ExecStartPre=+/usr/sbin/nft -f /etc/infinite/eval.nft
