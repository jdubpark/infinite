# Ages out agent temporary directories (INF-157). The agent wrappers export this
# path as TMPDIR; entries older than three days are removed by systemd-tmpfiles.
# Install: install -m 0644 deploy/ubuntu/infinite-tmpfiles.conf /etc/tmpfiles.d/infinite.conf
#          systemd-tmpfiles --clean /etc/tmpfiles.d/infinite.conf
e /srv/infinite-data/tmp/agent - - - 3d
