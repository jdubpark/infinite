# Drop-in for nftables.service, installed as /etc/systemd/system/nftables.service.d/infinite-eval.conf together with
# infinite-eval-firewall.service (see deploy/ubuntu/eval.md, step 5).
#
# nftables.service runs /etc/nftables.conf, whose "flush ruleset" removes every table, the eval table included. The
# firewall unit follows a restart and a reload, but systemd propagates no start, so these lines load the eval rule
# again as part of the same job, as egress/nftables-keeps-egress.conf does for the agent rule.
[Service]
ExecStartPost=/usr/sbin/nft -f /etc/infinite/eval.nft
ExecReload=/usr/sbin/nft -f /etc/infinite/eval.nft
