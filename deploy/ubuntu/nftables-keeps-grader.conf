# Drop-in for nftables.service, installed as /etc/systemd/system/nftables.service.d/infinite-grader.conf together with
# infinite-grader-firewall.service (see deploy/ubuntu/grader.md, step 4).
#
# nftables.service runs /etc/nftables.conf, whose "flush ruleset" removes every table, the grader table included. The
# firewall unit follows a restart and a reload, but systemd propagates no start, so these lines load the grader rule
# again as part of the same job, as egress/nftables-keeps-egress.conf does for the agent rule.
[Service]
ExecStartPost=/usr/sbin/nft -f /etc/infinite/grader.nft
ExecReload=/usr/sbin/nft -f /etc/infinite/grader.nft
